name: Bug report
description: Report a problem with the team website.
title: 'fix: '
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              Thanks for helping improve the team website. Please search existing issues before opening a new one.
    - type: input
      id: page
      attributes:
          label: Affected page
          description: Which page or URL has the problem?
          placeholder: https://team3100.com/about/info
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: What happened?
          description: Describe the problem and what you expected to happen.
          placeholder: Tell us what you saw and what you expected instead.
      validations:
          required: true
    - type: input
      id: browser
      attributes:
          label: Browser and version
          placeholder: Firefox 142
    - type: textarea
      id: reproduction
      attributes:
          label: Steps to reproduce
          description:
              List the steps someone else can follow to see the problem.
          placeholder: |
              1. Open ...
              2. Select ...
              3. See ...
    - type: textarea
      id: screenshots
      attributes:
          label: Screenshots or additional context
          description: Add screenshots, logs, or anything else that may help.
