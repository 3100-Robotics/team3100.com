name: Link check

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: links-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    links:
        name: Check links
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build site
              run: npm run build

            - name: Check generated links
              uses: lycheeverse/lychee-action@v2
              with:
                  args:
                      --verbose --no-progress --exclude-mail './dist/**/*.html'
                  fail: false
