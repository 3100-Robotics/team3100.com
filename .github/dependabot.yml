version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      cooldown:
          default-days: 3
      groups:
          astro:
              patterns:
                  - astro
                  - '@astrojs/*'
                  - typescript
              update-types:
                  - minor
                  - patch
          tooling:
              patterns:
                  - prettier
                  - prettier-plugin-astro
                  - cspell
                  - '@commitlint/*'
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      cooldown:
          default-days: 3
      groups:
          actions:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
